name: Maplog
options:
  bundleIdPrefix: com.chaerim
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: ko
packages:
  KakaoMapsSDK:
    url: https://github.com/kakao-mapsSDK/KakaoMapsSDK-SPM.git
    from: 2.12.14
settings:
  base:
    MARKETING_VERSION: "1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_VERSION: "5.0"
targets:
  Maplog:
    type: application
    platform: iOS
    configFiles:
      Debug: Config/Secrets.xcconfig
      Release: Config/Secrets.xcconfig
    sources:
      - path: Maplog
    resources:
      - path: Maplog/Resources
    dependencies:
      - package: KakaoMapsSDK
        product: KakaoMapsSDK-SPM
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.maplog.app
        GENERATE_INFOPLIST_FILE: NO
        INFOPLIST_FILE: Maplog/Info.plist
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
