name: 버그 신고
description: 앱에서 발생한 오류를 알려주세요.
title: "[fix] "
body:
  - type: textarea
    id: problem
    attributes:
      label: 어떤 문제가 있나요?
      description: 발생한 문제를 간단히 작성해주세요.
      placeholder: 예) 지도 화면에서 마커가 보이지 않아요.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: 재현 방법
      description: 문제가 발생하는 순서를 작성해주세요.
      placeholder: |
        1. 
        2. 
        3. 
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: 기대한 결과
      description: 원래 어떻게 동작해야 하나요?
    validations:
      required: true

  - type: textarea
    id: environment
    attributes:
      label: 사용 환경
      description: 기기, iOS 버전, 앱 버전을 작성해주세요.
      placeholder: |
        - 기기: 
        - iOS: 
        - 앱 버전: 
    validations:
      required: true

  - type: textarea
    id: extra
    attributes:
      label: 참고 자료
      description: 화면 캡처, 로그, 관련 이슈가 있으면 첨부해주세요.
    validations:
      required: false
