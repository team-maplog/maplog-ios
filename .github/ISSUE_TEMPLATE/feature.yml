name: 기능 요청
description: Maplog iOS에 추가할 기능을 제안하거나 작업을 등록합니다.
title: "[feat] "
body:
  - type: markdown
    attributes:
      value: |
        ## 작업을 시작하기 전에
        관련 백엔드 작업이 있으면 이슈 링크를 함께 적어주세요.

  - type: textarea
    id: summary
    attributes:
      label: 작업 내용
      description: 구현할 기능과 목적을 간단히 작성해주세요.
      placeholder: 예) 로그인 화면 구현 및 로그인 API 연동
    validations:
      required: true

  - type: textarea
    id: details
    attributes:
      label: 상세 내용
      description: 화면 흐름, 예외 상황, 기술적으로 고려할 내용을 작성해주세요.
      placeholder: |
        - 화면 또는 사용자 흐름
        - 예외 상황
        - 구현 시 참고 사항
    validations:
      required: true

  - type: textarea
    id: acceptance
    attributes:
      label: 완료 조건
      description: 이 작업이 완료되었다고 판단할 수 있는 기준을 체크리스트로 작성해주세요.
      placeholder: |
        - [ ] 
        - [ ] 
    validations:
      required: true

  - type: textarea
    id: related
    attributes:
      label: 관련 작업 및 API
      description: 관련 이슈, 백엔드 이슈, Figma, API 변경 사항을 적어주세요.
      placeholder: |
        - 관련 이슈: #
        - 백엔드 이슈: team-maplog/maplog-backend#
        - API: GET /api/v1/...
    validations:
      required: false

  - type: dropdown
    id: priority
    attributes:
      label: 우선순위
      options:
        - 높음
        - 보통
        - 낮음
    validations:
      required: true
